<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-hud">
        <div class="hud-left">
            <div class="hud-box">
                <span class="hud-label">معاك</span>
                <span id="cashValue" class="hud-value">10.000</span>
            </div>
            <div class="hud-box debt-box">
                <span class="hud-label">عليك</span>
                <span id="debtValue" class="hud-value">1.500</span>
            </div>
            <div class="hud-box time-box">
                <span class="hud-label">Time</span>
                <span id="gameTimer" class="hud-value">00:00:00</span>
            </div>
        </div>
        <button id="settingsBtn" class="btn-settings">Settings</button>
    </div>

    <div class="game-container">
        <div class="board-header">Lucky Bank</div>
        <div class="board-map">
            <div class="map-bg">
                <div class="river"></div>
                <div class="pyramid p1"></div>
                <div class="pyramid p2"></div>
            </div>
            <div class="dice-section">
                <button id="rollDiceBtn" class="btn-action btn-yes">رمي النرد</button>
                <div id="diceResult" class="dice-display">-</div>
            </div>
        </div>
    </div>

    <div class="leaderboard-container">
        <div class="board-header">Leaderboard</div>
        <div id="leaderboardList" class="leaderboard-list"></div>
    </div>

    <!-- نافذة الإعدادات (تستجيب فقط للضغط على زر Settings) -->
    <div id="settingsModal" class="modal-backdrop hidden">
        <div class="modal-card">
            <h3>الإعدادات</h3>
            <button id="exitBtn" class="btn-menu btn-danger">خروج من اللعبة</button>
            <button id="closeSettingsBtn" class="btn-menu">إغلاق</button>
        </div>
    </div>

    <!-- نافذة تأكيد الخروج -->
    <div id="exitConfirmModal" class="modal-backdrop hidden">
        <div class="modal-card">
            <h3>هل أنت متأكد من الخروج؟</h3>
            <div class="confirm-actions">
                <button id="confirmYesBtn" class="btn-action btn-yes">نعم</button>
                <button id="confirmNoBtn" class="btn-action btn-no">لا</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
